<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>상혁 3K 인터벌</title><style>:root{--bg:#0b0d10;--card:#14181e;--line:#252b33;--text:#f5f7fa;--muted:#98a2ad;--work:#ff6262;--rest:#51d890;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:620px;margin:auto;padding:18px 14px 30px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}.card,.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:14px;padding:15px}.weekbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.week{min-width:74px;background:#10141a;color:#cbd2da;border:1px solid var(--line);padding:11px 12px;border-radius:14px}.week.active{background:#f5f7fa;color:#0b0d10}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#0f1318;border-radius:14px;padding:12px;text-align:center}.metric b{display:block;font-size:18px}.metric span{font-size:11px;color:var(--muted)}.hero{text-align:center;padding:26px 18px;min-height:370px;display:flex;flex-direction:column;justify-content:center}.phase{font-size:18px;font-weight:800}.timer{font-size:clamp(78px,25vw,128px);font-weight:900;letter-spacing:-6px;font-variant-numeric:tabular-nums;line-height:1;margin:12px 0}.set{font-size:25px;font-weight:900}.hint{color:var(--muted);font-size:13px;margin-top:8px}.barwrap{height:8px;background:#242a31;border-radius:999px;overflow:hidden;margin-top:22px}.bar{height:100%;background:var(--accent);width:0}.splits{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.split{border:1px solid var(--line);border-radius:12px;padding:8px 3px;font-size:10px;color:var(--muted)}.split b{display:block;color:var(--text);font-size:13px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{border:0;border-radius:16px;padding:16px;font:inherit;font-weight:800}.primary{grid-column:1/-1;background:#f5f7fa;color:#0b0d10}.secondary{background:#1a2027;color:white;border:1px solid var(--line)}.danger{background:#24191a;color:#ff9c9c;border:1px solid #3a2426}.hidden{display:none!important}.plan{font-size:13px;line-height:1.55;color:#d5dbe2}.plan b{color:white}.draft{font-size:11px;color:#ffcc66;margin-top:10px}@media(max-width:390px){.summary{grid-template-columns:1fr 1fr 1fr}.app{padding-left:10px;padding-right:10px}.hero{min-height:350px}.timer{letter-spacing:-4px}}</style></head><body><main class="app"><div class="top"><div><h1>상혁 3K 인터벌</h1><div class="sub" id="subtitle">주차별 3km 12분 목표 프로그램</div></div><div class="pill" id="status">READY</div></div><section class="card"><div class="weekbar" id="weekbar"></div><div class="summary"><div class="metric"><b id="pace">3:55</b><span>훈련 페이스/km</span></div><div class="metric"><b id="target">1:34</b><span>400m 목표</span></div><div class="metric"><b id="setCount">5</b><span>세트</span></div></div><div class="plan" id="plan"></div><div class="draft">※ 현재는 운동 후 피드백 전 초안. 공개 배포용이 아님.</div></section><section class="hero" id="hero"><div class="phase" id="phase">준비</div><div class="timer" id="timer">1:34</div><div class="set" id="setline">1 / 5 SET</div><div class="hint" id="hint">400m 후 200m 조깅</div><div class="barwrap"><div class="bar" id="bar"></div></div><div class="splits" id="splits"></div></section><div class="controls"><button class="primary" id="start">인터벌 시작</button><button class="secondary hidden" id="next">200m 조깅 완료 → 다음 세트</button><button class="secondary" id="pause" disabled>일시정지</button><button class="danger" id="reset">리셋</button></div></main><script>(()=>{const weeks=[{w:1,sec:94,sets:5,pace:'3:55',desc:'적응 주간. 400m를 너무 세게 끊지 않고 일정하게 유지.'},{w:2,sec:93,sets:6,pace:'3:53',desc:'세트 수 증가. 마지막 세트까지 기록 편차를 작게.'},{w:3,sec:92,sets:6,pace:'3:50',desc:'속도 적응. 200m 조깅은 숨을 고르는 수준으로.'},{w:4,sec:91,sets:6,pace:'3:48',desc:'목표 페이스에 접근. 초반 오버페이스 금지.'},{w:5,sec:90,sets:6,pace:'3:45',desc:'현재 훈련 세션. 1:30 × 6 안정화가 목표.'},{w:6,sec:89,sets:6,pace:'3:43',desc:'조금 더 빠른 400m. 세트 간 회복 질 유지.'},{w:7,sec:88,sets:5,pace:'3:40',desc:'속도 여유 확보. 양보다 질에 집중.'},{w:8,sec:90,sets:4,pace:'3:45',desc:'테이퍼 주간. 피로를 줄이고 3km 테스트 준비.'}];const $=id=>document.getElementById(id);const E={weekbar:$('weekbar'),pace:$('pace'),target:$('target'),setCount:$('setCount'),plan:$('plan'),timer:$('timer'),setline:$('setline'),phase:$('phase'),hint:$('hint'),bar:$('bar'),splits:$('splits'),start:$('start'),next:$('next'),pause:$('pause'),reset:$('reset'),status:$('status'),hero:$('hero')};let selected=5,state='ready',set=1,raf,startAt,pauseAt=0,pauseAccum=0,restAt=0;const fmt=s=>{const m=Math.floor(s/60),x=Math.max(0,s-m*60);return `${m}:${Math.ceil(x).toString().padStart(2,'0')}`};const cfg=()=>weeks[selected-1];function renderWeeks(){E.weekbar.innerHTML=weeks.map(x=>`<button class="week ${x.w===selected?'active':''}" data-w="${x.w}">${x.w}주차</button>`).join('');E.weekbar.querySelectorAll('.week').forEach(b=>b.onclick=()=>{if(state!=='ready'&&state!=='done')return;selected=+b.dataset.w;renderAll()})}function renderAll(){const c=cfg();renderWeeks();E.pace.textContent=c.pace;E.target.textContent=fmt(c.sec);E.setCount.textContent=c.sets;E.plan.innerHTML=`<b>${c.w}주차:</b> ${c.desc}<br>구성: 400m × ${c.sets} / 세트 사이 200m 조깅`;E.splits.innerHTML=[1,2,3,4].map(n=>`<div class="split">${n*100}m<b>${(c.sec*n/4).toFixed(1)}초</b></div>`).join('');set=1;state='ready';E.phase.textContent='준비';E.timer.textContent=fmt(c.sec);E.setline.textContent=`1 / ${c.sets} SET`;E.hint.textContent='400m 후 200m 조깅';E.bar.style.width='0';E.start.classList.remove('hidden');E.next.classList.add('hidden');E.pause.disabled=true;E.pause.textContent='일시정지';E.status.textContent='READY'}function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();o.stop(a.currentTime+.12)}catch(e){}}function workStart(){const c=cfg();state='work';startAt=performance.now();pauseAccum=0;E.start.classList.add('hidden');E.next.classList.add('hidden');E.pause.disabled=false;E.phase.textContent='질주';E.status.textContent='RUN';E.hint.textContent=`400m 목표 ${fmt(c.sec)}`;beep();loop()}function loop(){cancelAnimationFrame(raf);if(state!=='work')return;const c=cfg(),e=(performance.now()-startAt-pauseAccum)/1000,left=c.sec-e;E.timer.textContent=fmt(left);E.bar.style.width=Math.min(100,e/c.sec*100)+'%';E.setline.textContent=`${set} / ${c.sets} SET`;if(left<=0){restStart();return}raf=requestAnimationFrame(loop)}function restStart(){state='rest';restAt=performance.now();E.phase.textContent='회복 조깅';E.status.textContent='JOG';E.hint.textContent='트랙 반바퀴 200m';E.next.classList.remove('hidden');E.pause.disabled=true;restLoop()}function restLoop(){if(state!=='rest')return;E.timer.textContent=fmt((performance.now()-restAt)/1000);raf=requestAnimationFrame(restLoop)}function next(){const c=cfg();cancelAnimationFrame(raf);if(set>=c.sets){finish();return}set++;workStart()}function finish(){state='done';cancelAnimationFrame(raf);E.phase.textContent='완료';E.timer.textContent='끝!';E.status.textContent='DONE';E.hint.textContent='쿨다운 후 오늘 기록을 남겨두자';E.next.classList.add('hidden');E.start.classList.remove('hidden');E.start.textContent='다시 시작';E.pause.disabled=true}function pause(){if(state==='work'){state='paused';pauseAt=performance.now();cancelAnimationFrame(raf);E.pause.textContent='계속';E.status.textContent='PAUSE'}else if(state==='paused'){pauseAccum+=performance.now()-pauseAt;state='work';E.pause.textContent='일시정지';E.status.textContent='RUN';loop()}}E.start.onclick=()=>{if(state==='done')renderAll();setTimeout(workStart,300)};E.next.onclick=next;E.pause.onclick=pause;E.reset.onclick=renderAll;renderAll()})();</script></body></html>
